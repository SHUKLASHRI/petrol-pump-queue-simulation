      const files = {
  "app.py": "\"\"\"\nPetrol Pump Queue Simulation and Modelling Studio\n=================================================\nA discrete-event simulation application built with Streamlit, SimPy, and Plotly.\n\"\"\"\n\nimport sys\nimport os\n\n# Ensure project root is on the Python path\nsys.path.insert(0, os.path.dirname(os.path.abspath(__file__)))\n\nimport streamlit as st\nimport numpy as np\nimport pandas as pd\nimport plotly.graph_objects as go\n\nfrom simulation.engine import PetrolPumpSimulation, SimulationConfig\nfrom simulation.metrics import compute_metrics\nfrom simulation.scenarios import ScenarioRunner, ScenarioConfig\nfrom visualization.charts import (\n    queue_length_chart,\n    arrivals_and_departures_chart,\n    waiting_time_distribution_chart,\n    dispenser_utilisation_chart,\n    scenario_waiting_time_chart,\n    scenario_queue_length_chart,\n    scenario_utilisation_chart,\n    scenario_throughput_chart,\n    COMMON_LAYOUT,\n    COLOR_EMERALD,\n    COLOR_CYAN,\n    COLOR_BLUE,\n    COLOR_AMBER,\n    COLOR_ROSE,\n)\nfrom visualization.dashboard import render_kpi_cards, render_live_station\nfrom utils.helpers import vehicles_to_dataframe, traffic_intensity\n\n# \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n# Page Configuration\n# \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\nst.set_page_config(\n    page_title=\"PetroFlow \u2022 Petrol Pump Queue Simulation\",\n    page_icon=\"\u26fd\",\n    layout=\"wide\",\n    initial_sidebar_state=\"expanded\",\n)\n\n# \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n# Ultra-Modern Executive Glassmorphic CSS Theme\n# \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\nst.markdown(\"\"\"\n<style>\n    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap');\n\n    /* Global Typography & Background */\n    html, body, [class*=\"css\"] {\n        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;\n    }\n    \n    .stApp {\n        background-color: #080c14;\n        background-image: radial-gradient(circle at 50% 0%, rgba(16, 185, 129, 0.06) 0%, rgba(8, 12, 20, 1) 75%);\n        color: #f1f5f9;\n    }\n\n    /* Sidebar Styling */\n    section[data-testid=\"stSidebar\"] {\n        background-color: #0d121f !important;\n        border-right: 1px solid rgba(255, 255, 255, 0.08);\n    }\n    section[data-testid=\"stSidebar\"] .stMarkdown h2, \n    section[data-testid=\"stSidebar\"] .stMarkdown h3 {\n        color: #f8fafc !important;\n        font-weight: 700;\n        letter-spacing: -0.02em;\n    }\n\n    /* Modern Glassmorphic Cards */\n    .kpi-card {\n        background: rgba(17, 24, 39, 0.7);\n        backdrop-filter: blur(16px);\n        -webkit-backdrop-filter: blur(16px);\n        border: 1px solid rgba(255, 255, 255, 0.08);\n        border-radius: 14px;\n        padding: 18px 20px;\n        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);\n        transition: transform 0.2s ease, border-color 0.2s ease;\n    }\n    .kpi-card:hover {\n        border-color: rgba(16, 185, 129, 0.4);\n        transform: translateY(-2px);\n    }\n    .kpi-header {\n        display: flex;\n        justify-content: space-between;\n        align-items: center;\n        margin-bottom: 12px;\n    }\n    .kpi-icon {\n        display: inline-flex;\n        align-items: center;\n        justify-content: center;\n        width: 36px;\n        height: 36px;\n        border-radius: 10px;\n        font-size: 1.1rem;\n    }\n    .icon-emerald { background: rgba(16, 185, 129, 0.15); color: #10b981; }\n    .icon-blue    { background: rgba(59, 130, 246, 0.15); color: #3b82f6; }\n    .icon-amber   { background: rgba(245, 158, 11, 0.15); color: #f59e0b; }\n    .icon-purple  { background: rgba(139, 92, 246, 0.15); color: #8b5cf6; }\n    .kpi-tag {\n        font-size: 0.72rem;\n        font-weight: 600;\n        text-transform: uppercase;\n        letter-spacing: 0.05em;\n        color: #94a3b8;\n    }\n    .kpi-value {\n        font-size: 2.1rem;\n        font-weight: 800;\n        color: #ffffff;\n        letter-spacing: -0.03em;\n        line-height: 1.1;\n    }\n    .kpi-unit {\n        font-size: 0.95rem;\n        font-weight: 500;\n        color: #94a3b8;\n    }\n    .kpi-label {\n        font-size: 0.85rem;\n        font-weight: 500;\n        color: #94a3b8;\n        margin-top: 4px;\n    }\n    .kpi-footer {\n        margin-top: 14px;\n        padding-top: 10px;\n        border-top: 1px solid rgba(255, 255, 255, 0.06);\n    }\n    .kpi-sub {\n        font-size: 0.78rem;\n        color: #cbd5e1;\n    }\n\n    /* Badges & Status Pills */\n    .status-pill {\n        display: inline-flex;\n        align-items: center;\n        padding: 3px 10px;\n        border-radius: 9999px;\n        font-size: 0.72rem;\n        font-weight: 600;\n        letter-spacing: 0.02em;\n    }\n    .pill-green { background: rgba(16, 185, 129, 0.18); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3); }\n    .pill-amber  }\n\n    /* Station Visualizer Components */\n    .station-terminal-header {\n        background: rgba(17, 24, 39, 0.85);\n        border: 1px solid rgba(255, 255, 255, 0.08);\n        border-radius: 14px;\n        padding: 16px 20px;\n        margin-bottom: 16px;\n    }\n    .pulse-indicator {\n        width: 10px;\n        height: 10px;\n        border-radius: 50%;\n        background: #10b981;\n        box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7);\n        animation: pulse 1.8s infinite;\n    }\n    @keyframes pulse {\n        0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }\n        70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(16, 185, 129, 0); }\n        100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }\n    }\n    .station-chip {\n        font-size: 0.75rem;\n        font-weight: 600;\n        padding: 4px 10px;\n        border-radius: 6px;\n    }\n    .chip-blue    { background: rgba(59, 130, 246, 0.15); color: #60a5fa; border: 1px solid rgba(59, 130, 246, 0.3); }\n    .chip-amber   { background: rgba(245, 158, 11, 0.15); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.3); }\n    .chip-emerald { background: rgba(16, 185, 129, 0.15); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3); }\n\n    .lane-container {\n        background: rgba(15, 23, 42, 0.5);\n        border: 1px solid rgba(255, 255, 255, 0.06);\n        border-radius: 14px;\n        padding: 16px;\n        min-height: 440px;\n    }\n    .lane-title {\n        display: flex;\n        justify-content: space-between;\n        align-items: center;\n        font-size: 0.82rem;\n        font-weight: 700;\n        color: #94a3b8;\n        letter-spacing: 0.04em;\n        margin-bottom: 12px;\n        padding-bottom: 8px;\n        border-bottom: 1px solid rgba(255, 255, 255, 0.06);\n    }\n    .lane-badge {\n        font-size: 0.7rem;\n        padding: 2px 8px;\n        border-radius: 4px;\n        background: rgba(255, 255, 255, 0.08);\n        color: #cbd5e1;\n    }\n\n    .queue-vehicle-card {\n        background: rgba(30, 41, 59, 0.7);\n        border: 1px solid rgba(255, 255, 255, 0.06);\n        border-radius: 8px;\n        padding: 9px 12px;\n        margin-bottom: 8px;\n        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);\n    }\n    .time-tag {\n        font-family: 'JetBrains Mono', monospace;\n        font-size: 0.72rem;\n        font-weight: 600;\n        color: #fbbf24;\n    }\n\n    .dispenser-box {\n        border-radius: 12px;\n        padding: 14px;\n        margin-bottom: 12px;\n        transition: all 0.2s ease;\n    }\n    .bay-active {\n        background: linear-gradient(145deg, rgba(14, 165, 233, 0.12), rgba(15, 23, 42, 0.8));\n        border: 1.5px solid rgba(14, 165, 233, 0.45);\n        box-shadow: 0 0 15px rgba(14, 165, 233, 0.15);\n    }\n    .bay-idle {\n        background: rgba(30, 41, 59, 0.4);\n        border: 1px dashed rgba(255, 255, 255, 0.1);\n    }\n    .bay-header {\n        display: flex;\n        justify-content: space-between;\n        align-items: center;\n        margin-bottom: 8px;\n    }\n    .bay-num {\n        font-size: 0.75rem;\n        font-weight: 800;\n        color: #94a3b8;\n        letter-spacing: 0.05em;\n    }\n    .bay-status {\n        font-size: 0.7rem;\n        font-weight: 700;\n    }\n    .status-fueling { color: #38bdf8; }\n    .status-idle    { color: #64748b; }\n    .bay-vehicle {\n        display: flex;\n        justify-content: space-between;\n        align-items: center;\n        margin-bottom: 8px;\n        font-weight: 600;\n        color: #ffffff;\n    }\n    .vehicle-id-pill {\n        font-size: 0.7rem;\n        padding: 2px 6px;\n        border-radius: 4px;\n        background: rgba(14, 165, 233, 0.2);\n        color: #38bdf8;\n    }\n    .progress-container {\n        width: 100%;\n        height: 6px;\n        background: rgba(255, 255, 255, 0.08);\n        border-radius: 999px;\n        overflow: hidden;\n        margin-bottom: 6px;\n    }\n    .progress-bar-fill {\n        height: 100%;\n        background: linear-gradient(90deg, #0ea5e9, #10b981);\n        border-radius: 999px;\n        transition: width 0.3s ease;\n    }\n    .bay-timer-row {\n        display: flex;\n        justify-content: space-between;\n        font-size: 0.72rem;\n        color: #94a3b8;\n    }\n    .idle-graphic {\n        text-align: center;\n        font-size: 1.8rem;\n        opacity: 0.35;\n        padding: 6px 0;\n    }\n\n    .exit-card {\n        background: rgba(30, 41, 59, 0.5);\n        border: 1px solid rgba(255, 255, 255, 0.05);\n        border-radius: 8px;\n        padding: 8px 12px;\n        margin-bottom: 6px;\n    }\n    .empty-lane-state {\n        text-align: center;\n        padding: 60px 16px;\n    }\n\n    /* Buttons */\n    div.stButton > button:first-child {\n        background: linear-gradient(135deg, #10b981 0%, #059669 100%);\n        color: #ffffff !important;\n        font-weight: 700;\n        border: none;\n        border-radius: 8px;\n        padding: 10px 20px;\n        box-shadow: 0 4px 12px rgba(16, 185, 129, 0.25);\n        transition: all 0.2s ease;\n    }\n    div.stButton > button:first-child:hover {\n        transform: translateY(-1px);\n        box-shadow: 0 6px 16px rgba(16, 185, 129, 0.35);\n    }\n</style>\n\"\"\", unsafe_allow_html=True)\n\n# \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n# Quick Preset Configurations Handler\n# \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\nPRESETS = {\n    \"Urban Commute (Balanced)\": {\n        \"num_dispensers\": 3,\n        \"arrival_rate\": 20.0,\n        \"avg_service_time\": 5.0,\n        \"service_time_std\": 1.5,\n        \"sim_duration\": 120,\n    },\n    \"Morning Peak Rush\": {\n        \"num_dispensers\": 3,\n        \"arrival_rate\": 34.0,\n        \"avg_service_time\": 4.5,\n        \"service_time_std\": 1.2,\n        \"sim_duration\": 120,\n    },\n    \"Highway Mega-Station\": {\n        \"num_dispensers\": 6,\n        \"arrival_rate\": 65.0,\n        \"avg_service_time\": 4.0,\n        \"service_time_std\": 1.0,\n        \"sim_duration\": 180,\n    },\n    \"Severe Bottleneck (Stress Test)\": {\n        \"num_dispensers\": 1,\n        \"arrival_rate\": 22.0,\n        \"avg_service_time\": 5.5,\n        \"service_time_std\": 1.5,\n        \"sim_duration\": 90,\n    },\n}\n\n# \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n# Sidebar: Parameter Control Center\n# \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\nwith st.sidebar:\n    st.markdown(\"\"\"\n    <div style=\"display: flex; align-items: center; gap: 10px; margin-bottom: 12px;\">\n        <span style=\"font-size: 1.8rem;\">\u26fd</span>\n        <div>\n            <div style=\"font-weight: 800; font-size: 1.15rem; color: #ffffff; letter-spacing: -0.02em;\">PETROFLOW</div>\n            <div style=\"font-size: 0.72rem; color: #10b981; font-weight: 600;\">SIMULATION ENGINE v2.0</div>\n        </div>\n    </div>\n    \"\"\", unsafe_allow_html=True)\n    st.markdown(\"---\")\n\n    # Quick Scenario Presets\n    st.markdown(\"#### \u26a1 Quick Presets\")\n    preset_choice = st.selectbox(\n        \"Load Preset Scenario\",\n        [\"Select a preset...\", *list(PRESETS.keys())],\n        index=0,\n        label_visibility=\"collapsed\",\n    )\n\n    if preset_choice != \"Select a preset...\":\n        p = PRESETS[preset_choice]\n        st.session_state[\"num_dispensers\"] = p[\"num_dispensers\"]\n        st.session_state[\"arrival_rate\"] = p[\"arrival_rate\"]\n        st.session_state[\"avg_service_time\"] = p[\"avg_service_time\"]\n        st.session_state[\"service_time_std\"] = p[\"service_time_std\"]\n        st.session_state[\"sim_duration\"] = p[\"sim_duration\"]\n\n    st.markdown(\"#### \ud83c\udf9b\ufe0f Station Parameters\")\n\n    num_dispensers = st.slider(\n        \"Fuel Dispensers (c)\",\n        min_value=1, max_value=10,\n        value=st.session_state.get(\"num_dispensers\", 3),\n        help=\"Number of parallel fuel pumps available at the station.\",\n    )\n\n    arrival_rate = st.slider(\n        \"Arrival Rate \u03bb (veh/hr)\",\n        min_value=1.0, max_value=120.0,\n        value=st.session_state.get(\"arrival_rate\", 20.0),\n        step=1.0,\n        help=\"Average rate of incoming vehicles per hour (Poisson process).\",\n    )\n\n    avg_service_time = st.slider(\n        \"Avg Service Time 1/\u03bc (min)\",\n        min_value=1.0, max_value=20.0,\n        value=st.session_state.get(\"avg_service_time\", 5.0),\n        step=0.5,\n        help=\"Mean fueling and payment duration per vehicle.\",\n    )\n\n    service_time_std = st.slider(\n        \"Service Std Dev \u03c3 (min)\",\n        min_value=0.0, max_value=5.0,\n        value=st.session_state.get(\"service_time_std\", 1.5),\n        step=0.1,\n        help=\"Variability in service times (truncated normal).\",\n    )\n\n    st.markdown(\"#### \u23f1\ufe0f Simulation Settings\")\n    sim_duration = st.slider(\n        \"Run Duration (min)\",\n        min_value=30, max_value=480,\n        value=st.session_state.get(\"sim_duration\", 120),\n        step=10,\n        help=\"Simulated time span in minutes.\",\n    )\n\n    random_seed = st.number_input(\n        \"Stochastic Seed\",\n        min_value=0, max_value=99999,\n        value=st.session_state.get(\"random_seed\", 42),\n        help=\"RNG seed for exact scientific reproducibility.\",\n    )\n\n    st.markdown(\"---\")\n\n    # Real-Time Traffic Intensity Calculation\n    service_rate_per_pump = 60.0 / avg_service_time  # veh/hr\n    total_capacity = num_dispensers * service_rate_per_pump\n    rho = traffic_intensity(arrival_rate, service_rate_per_pump, num_dispensers)\n\n    st.markdown(f\"\"\"\n    <div style=\"background: rgba(15, 23, 42, 0.7); border: 1px solid rgba(255,255,255,0.08); border-radius: 10px; padding: 12px; margin-bottom: 14px;\">\n        <div style=\"display:flex; justify-content:space-between; font-size:0.75rem; color:#94a3b8; margin-bottom:4px;\">\n            <span>Traffic Intensity (\u03c1)</span>\n            <span style=\"font-weight:700; color:{'#34d399' if rho < 0.7 else ('#fbbf24' if rho < 1.0 else '#f87171')}\">{rho:.3f}</span>\n        </div>\n        <div style=\"width:100%; height:6px; background:rgba(255,255,255,0.1); border-radius:999px; overflow:hidden;\">\n            <div style=\"width:{min(100.0, rho * 100):.0f}%; height:100%; background:{'#10b981' if rho < 0.7 else ('#f59e0b' if rho < 1.0 else '#ef4444')};\"></div>\n        </div>\n        <div style=\"font-size:0.72rem; color:#94a3b8; margin-top:6px;\">\n            Arrival Demand: <b>{arrival_rate:.0f}</b> / Capacity: <b>{total_capacity:.0f}</b> veh/hr\n        </div>\n    </div>\n    \"\"\", unsafe_allow_html=True)\n\n    if st.button(\"\u26a1 Run Simulation Engine\", type=\"primary\", use_container_width=True):\n        st.session_state[\"force_rerun\"] = True\n\n# \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n# Execute Discrete-Event Simulation\n# \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\nconfig = SimulationConfig(\n    num_dispensers=num_dispensers,\n    arrival_rate=arrival_rate,\n    avg_service_time=avg_service_time,\n    service_time_std=service_time_std,\n    min_service_time=max(1.0, avg_service_time - 3 * service_time_std),\n    max_service_time=avg_service_time + 3 * service_time_std,\n    simulation_duration=float(sim_duration),\n    random_seed=int(random_seed),\n)\n\n\n@st.cache_data\ndef execute_simulation(nd, ar, ast_, sts, mn, mx, sd, rs):\n    cfg = SimulationConfig(\n        num_dispensers=nd,\n        arrival_rate=ar,\n        avg_service_time=ast_,\n        service_time_std=sts,\n        min_service_time=mn,\n        max_service_time=mx,\n        simulation_duration=sd,\n        random_seed=rs,\n    )\n    sim = PetrolPumpSimulation(cfg)\n    res = sim.run()\n    met = compute_metrics(res)\n    return res, met, cfg\n\n\nresult, metrics, _ = execute_simulation(\n    config.num_dispensers,\n    config.arrival_rate,\n    config.avg_service_time,\n    config.service_time_std,\n    config.min_service_time,\n    config.max_service_time,\n    config.simulation_duration,\n    config.random_seed,\n)\n\n# \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n# Hero Banner\n# \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\nif rho < 0.7:\n    status_indicator = '<span class=\"status-pill pill-green\">\ud83d\udfe2 Normal Flow (\u03c1 = {:.2f})</span>'.format(rho)\n    status_desc = \"Optimal operating state: Queue delays are minimal and customer turnaround is fast.\"\nelif rho < 1.0:\n    status_indicator = '<span class=\"status-pill pill-amber\">\ud83d\udfe1 Heavy Traffic (\u03c1 = {:.2f})</span>'.format(rho)\n    status_desc = \"High utilization: Queues form intermittently during arrival bursts.\"\nelse:\n    status_indicator = '<span class=\"status-pill pill-rose\">\ud83d\udd34 System Saturated (\u03c1 = {:.2f})</span>'.format(rho)\n    status_desc = \"Unstable condition: Demand exceeds service capacity; queues expand indefinitely.\"\n\nst.markdown(f\"\"\"\n<div class=\"hero-banner\">\n    <div>\n        <h1 class=\"hero-title\">\n            <span>\u26fd PetroFlow</span>\n            <span style=\"font-weight: 400; color: #94a3b8; font-size: 1.25rem;\">| Queue Simulation &amp; Modelling Studio</span>\n        </h1>\n        <p class=\"hero-desc\">\n            SimPy Discrete-Event Queue Engine \u2022 M/G/{num_dispensers} Multi-Server Stochastic Process \u2022 FCFS Service Discipline\n        </p>\n    </div>\n    <div style=\"display: flex; flex-direction: column; align-items: flex-end; gap: 4px;\">\n        {status_indicator}\n        <span style=\"font-size: 0.75rem; color: #94a3b8;\">{status_desc}</span>\n    </div>\n</div>\n\"\"\", unsafe_allow_html=True)\n\n# \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n# Interactive Tabs Architecture\n# \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\ntabs = st.tabs([\n    \"\ud83d\udcca KPI Overview\",\n    \"\ud83c\udfd7\ufe0f Live Station Visualizer\",\n    \"\ud83d\udcc8 Queue & Traffic Analytics\",\n    \"\ud83d\udcd0 Statistical Deep-Dive\",\n    \"\ud83d\udd00 Multi-Scenario Benchmark\",\n    \"\ud83d\udd2e Sensitivity / What-If\",\n    \"\ud83d\udcd6 Mathematical Model\",\n])\n\n# \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n# TAB 1 \u2014 KPI Overview & Vehicle Log\n# \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\nwith tabs[0]:\n    render_kpi_cards(metrics, rho)\n\n    # Operational Health Card\n    st.markdown(\"<div style='height: 16px;'></div>\", unsafe_allow_html=True)\n    c_sum1, c_sum2 = st.columns([1.5, 1])\n    with c_sum1:\n        st.markdown(f\"\"\"\n        <div style=\"background: rgba(17, 24, 39, 0.6); border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; padding: 18px 22px;\">\n            <div style=\"font-size: 0.95rem; font-weight: 700; color: #f8fafc; margin-bottom: 8px;\">\n                \ud83d\udca1 Operational Diagnosis &amp; System Health\n            </div>\n            <div style=\"font-size: 0.85rem; color: #cbd5e1; line-height: 1.6;\">\n                \u2022 <b>Arrival Rate:</b> {config.arrival_rate:.1f} vehicles/hour with average service duration of {config.avg_service_time:.1f} minutes.<br>\n                \u2022 <b>Effective Service Capacity:</b> {total_capacity:.1f} vehicles/hour across {config.num_dispensers} dispenser(s).<br>\n                \u2022 <b>Turnaround Efficiency:</b> Average customer stays in the station for <b>{metrics.avg_time_in_system:.2f} minutes</b> (waiting: {metrics.avg_waiting_time:.2f}m, fueling: {metrics.avg_time_in_system - metrics.avg_waiting_time:.2f}m).<br>\n                \u2022 <b>Queue Congestion Risk:</b> {'Low \u2014 dispensers handle traffic smoothly.' if rho < 0.7 else ('Moderate \u2014 queues accumulate during micro-peaks.' if rho < 1.0 else 'Critical \u2014 arrival rate exceeds capacity. Adding another dispenser is strongly recommended.')}\n            </div>\n        </div>\n        \"\"\", unsafe_allow_html=True)\n\n    with c_sum2:\n        st.markdown(f\"\"\"\n        <div style=\"background: rgba(17, 24, 39, 0.6); border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; padding: 18px 22px;\">\n            <div style=\"font-size: 0.95rem; font-weight: 700; color: #f8fafc; margin-bottom: 8px;\">\n                \u26a1 Fast Insights\n            </div>\n            <div style=\"font-size: 0.82rem; color: #94a3b8; line-height: 1.55;\">\n                <span style=\"color:#10b981;\">\u2714</span> <b>Completed Vehicles:</b> {metrics.total_served:,} of {metrics.total_arrived:,}<br>\n                <span style=\"color:#38bdf8;\">\u2714</span> <b>95% of Customers Wait Under:</b> {metrics.p95_waiting_time:.2f} min<br>\n                <span style=\"color:#f59e0b;\">\u2714</span> <b>Peak Queue Recorded:</b> {metrics.max_queue_length} vehicles<br>\n                <span style=\"color:#8b5cf6;\">\u2714</span> <b>Hourly Station Throughput:</b> {metrics.throughput_per_hour:.1f} veh/hr\n            </div>\n        </div>\n        \"\"\", unsafe_allow_html=True)\n\n    st.markdown(\"<div style='height: 20px;'></div>\", unsafe_allow_html=True)\n    st.markdown(\"#### \ud83d\udccb Vehicle Event Ledger\")\n    \n    df_vehicles = vehicles_to_dataframe(result.vehicles)\n    \n    # Filter controls\n    col_f1, col_f2 = st.columns([2, 1])\n    with col_f1:\n        search_status = st.multiselect(\n            \"Filter by Lifecycle Status\",\n            [\"completed\", \"fueling\", \"waiting\"],\n            default=[\"completed\", \"fueling\", \"waiting\"],\n        )\n    with col_f2:\n        # CSV Export\n        csv_data = df_vehicles.to_csv(index=False).encode('utf-8')\n        st.download_button(\n            label=\"\ud83d\udce5 Download Event Ledger (CSV)\",\n            data=csv_data,\n            file_name=\"petrol_pump_simulation_results.csv\",\n            mime=\"text/csv\",\n            use_container_width=True,\n        )\n\n    if search_status:\n        filtered_df = df_vehicles[df_vehicles[\"Status\"].isin(search_status)]\n    else:\n        filtered_df = df_vehicles\n\n    st.dataframe(\n        filtered_df,\n        use_container_width=True,\n        height=340,\n    )\n\n# \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n# TAB 2 \u2014 Live Station Layout Visualizer\n# \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\nwith tabs[1]:\n    st.markdown(\"### \ud83c\udfd7\ufe0f Forecourt Live Simulation Visualizer\")\n    st.markdown(\n        \"Scrub through the simulation timeline to watch queue formation, \"\n        \"dispenser allocation, and customer departure dynamics in real-time.\"\n    )\n\n    t_col1, t_col2 = st.columns([3, 1])\n    with t_col1:\n        time_scrubber = st.slider(\n            \"Timeline Time (T in minutes)\",\n            min_value=0.0,\n            max_value=float(config.simulation_duration),\n            value=float(config.simulation_duration),\n            step=1.0,\n            key=\"forecourt_timeline_slider\",\n        )\n    with t_col2:\n        st.markdown(\"<div style='height: 26px;'></div>\", unsafe_allow_html=True)\n        if st.button(\"\u23ee Jump to T=15m\", use_container_width=True):\n            st.session_state[\"forecourt_timeline_slider\"] = 15.0\n\n    render_live_station(result, time_scrubber, config.num_dispensers)\n\n# \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n# TAB 3 \u2014 Queue & Traffic Analytics\n# \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\nwith tabs[2]:\n    st.markdown(\"### \ud83d\udcc8 Forecourt Queue & Velocity Analytics\")\n    st.markdown(\"Interactive analytical charts examining stochastic queue build-up and service velocity.\")\n\n    q_col1, q_col2 = st.columns(2)\n    with q_col1:\n        st.plotly_chart(queue_length_chart(result.queue_length_over_time), use_container_width=True)\n    with q_col2:\n        st.plotly_chart(arrivals_and_departures_chart(result), use_container_width=True)\n\n    q_col3, q_col4 = st.columns(2)\n    with q_col3:\n        st.plotly_chart(waiting_time_distribution_chart(result), use_container_width=True)\n    with q_col4:\n        st.plotly_chart(dispenser_utilisation_chart(metrics, config.num_dispensers), use_container_width=True)\n\n# \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n# TAB 4 \u2014 Statistical Deep-Dive\n# \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\nwith tabs[3]:\n    st.markdown(\"### \ud83d\udcd0 Statistical Deep-Dive & Queueing Theory Verification\")\n\n    stat_col1, stat_col2 = st.columns(2)\n    with stat_col1:\n        st.markdown(\"#### Waiting Time Dispersion Metrics\")\n        wait_df = pd.DataFrame({\n            \"Metric\": [\n                \"Mean Waiting Time (Wq)\",\n                \"Median Waiting Time\",\n                \"Std Dev of Waiting Time\",\n                \"95th Percentile Wait\",\n                \"Maximum Wait Experienced\",\n            ],\n            \"Simulation Value\": [\n                f\"{metrics.avg_waiting_time:.3f} min\",\n                f\"{metrics.median_waiting_time:.3f} min\",\n                f\"{metrics.std_waiting_time:.3f} min\",\n                f\"{metrics.p95_waiting_time:.3f} min\",\n                f\"{metrics.max_waiting_time:.3f} min\",\n            ],\n            \"Theoretical Significance\": [\n                \"Expected time a vehicle remains in the queue prior to nozzle insertion.\",\n                \"50% of vehicles experienced lower wait times than this value.\",\n                \"Degree of dispersion and predictability in service turnaround.\",\n                \"Service SLA benchmark: 95% of all drivers wait less than this.\",\n                \"Worst-case bottleneck duration recorded in the run.\",\n            ]\n        })\n        st.dataframe(wait_df, use_container_width=True, hide_index=True)\n\n    with stat_col2:\n        st.markdown(\"#### Forecourt System Performance\")\n        sys_df = pd.DataFrame({\n            \"Metric\": [\n                \"Mean Time in Station (W)\",\n                \"Time-Weighted Queue Length (Lq)\",\n                \"Peak Queue Depth Recorded\",\n                \"Aggregate Dispenser Utilization\",\n                \"Effective Service Throughput\",\n            ],\n            \"Simulation Value\": [\n                f\"{metrics.avg_time_in_system:.3f} min\",\n                f\"{metrics.avg_queue_length:.3f} vehicles\",\n                f\"{metrics.max_queue_length} vehicles\",\n                f\"{metrics.avg_utilisation:.1%}\",\n                f\"{metrics.throughput_per_hour:.1f} veh/hr\",\n            ],\n            \"Theoretical Significance\": [\n                \"Total dwell time from station entry to final departure.\",\n                \"Integral of queue length over total simulated duration.\",\n                \"Highest instantaneous backlog observed in the approach lane.\",\n                \"Percentage of available pump capacity actively fueling vehicles.\",\n                \"Completed vehicle processing rate per elapsed hour.\",\n            ]\n        })\n        st.dataframe(sys_df, use_container_width=True, hide_index=True)\n\n    st.markdown(\"---\")\n    \n    # Little's Law Empirical Proof\n    st.markdown(\"#### \u2696\ufe0f Little's Law Empirical Validation: L = \u03bb \u00b7 W\")\n    \n    lam_min = config.arrival_rate / 60.0\n    L_sim = metrics.avg_queue_length\n    W_sim = metrics.avg_waiting_time\n    L_pred = lam_min * W_sim\n    diff_pct = abs(L_sim - L_pred) / max(0.01, L_sim) * 100.0\n\n    st.markdown(f\"\"\"\n    <div style=\"background: rgba(17, 24, 39, 0.7); border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; padding: 20px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px;\">\n        <div>\n            <div style=\"font-size: 1.1rem; font-weight: 700; color: #f8fafc;\">\n                Formula: L<sub>q</sub> = \u03bb \u00b7 W<sub>q</sub>\n            </div>\n            <div style=\"font-size: 0.85rem; color: #94a3b8; margin-top: 4px;\">\n                Where <b>\u03bb</b> = {lam_min:.4f} veh/min, <b>W<sub>q</sub></b> = {W_sim:.3f} min\n            </div>\n        </div>\n        <div style=\"display: flex; gap: 20px;\">\n            <div style=\"text-align: right;\">\n                <div style=\"font-size: 0.75rem; color: #94a3b8;\">Simulated L<sub>q</sub></div>\n                <div style=\"font-size: 1.4rem; font-weight: 800; color: #10b981;\">{L_sim:.3f}</div>\n            </div>\n            <div style=\"text-align: right;\">\n                <div style=\"font-size: 0.75rem; color: #94a3b8;\">Predicted \u03bb \u00b7 W<sub>q</sub></div>\n                <div style=\"font-size: 1.4rem; font-weight: 800; color: #38bdf8;\">{L_pred:.3f}</div>\n            </div>\n            <div style=\"text-align: right;\">\n                <div style=\"font-size: 0.75rem; color: #94a3b8;\">Discrepancy</div>\n                <div style=\"font-size: 1.4rem; font-weight: 800; color: {'#34d399' if diff_pct < 10 else '#fbbf24'};\">{diff_pct:.1f}%</div>\n            </div>\n        </div>\n    </div>\n    \"\"\", unsafe_allow_html=True)\n    st.caption(\"Note: Residual divergence under 10% is expected in finite-horizon simulations due to transient initialization and discrete event boundaries.\")\n\n# \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n# TAB 5 \u2014 Multi-Scenario Benchmark\n# \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\nwith tabs[4]:\n    st.markdown(\"### \ud83d\udd00 Multi-Scenario Benchmark & Capacity Planning\")\n    st.markdown(\n        \"Evaluate station performance across different numbers of fuel dispensers (1 to 4) \"\n        \"under identical arrival pressure to determine the optimal capital allocation.\"\n    )\n\n    sc_c1, sc_c2 = st.columns([2, 1])\n    with sc_c1:\n        benchmark_arrival = st.slider(\n            \"Benchmark Arrival Demand \u03bb (veh/hr)\",\n            min_value=5.0, max_value=80.0,\n            value=float(config.arrival_rate),\n            step=1.0,\n            key=\"benchmark_arr_rate\",\n        )\n    with sc_c2:\n        benchmark_reps = st.slider(\n            \"Replications per Configuration\",\n            min_value=1, max_value=5, value=2,\n            help=\"Average over multiple stochastic runs to smooth variance.\",\n        )\n\n    # Build 4 comparative scenarios\n    scenarios = []\n    for nd in [1, 2, 3, 4]:\n        sc_cfg = SimulationConfig(\n            num_dispensers=nd,\n            arrival_rate=benchmark_arrival,\n            avg_service_time=config.avg_service_time,\n            service_time_std=config.service_time_std,\n            min_service_time=config.min_service_time,\n            max_service_time=config.max_service_time,\n            simulation_duration=config.simulation_duration,\n            random_seed=config.random_seed,\n        )\n        scenarios.append(ScenarioConfig(name=f\"{nd} Pump{'s' if nd > 1 else ''}\", config=sc_cfg))\n\n    sc_results = ScenarioRunner.run_multiple(scenarios, repetitions=benchmark_reps)\n\n    # Results Table\n    sc_summary_data = []\n    for sr in sc_results:\n        rho_sc = traffic_intensity(sr.config.arrival_rate, 60.0 / sr.config.avg_service_time, sr.config.num_dispensers)\n        sc_summary_data.append({\n            \"Configuration\": sr.name,\n            \"Pumps\": sr.config.num_dispensers,\n            \"Traffic Intensity (\u03c1)\": f\"{rho_sc:.3f}\",\n            \"Status\": \"\ud83d\udfe2 Stable\" if rho_sc < 0.8 else (\"\ud83d\udfe1 Congested\" if rho_sc < 1.0 else \"\ud83d\udd34 Saturated\"),\n            \"Avg Wait Time\": f\"{sr.metrics.avg_waiting_time:.2f} min\",\n            \"Max Queue Depth\": f\"{sr.metrics.max_queue_length} veh\",\n            \"Pump Utilization\": f\"{sr.metrics.avg_utilisation:.1%}\",\n            \"Throughput\": f\"{sr.metrics.throughput_per_hour:.1f} veh/hr\",\n        })\n    st.dataframe(pd.DataFrame(sc_summary_data), use_container_width=True, hide_index=True)\n\n    # Comparison Grid Charts\n    sc_g1, sc_g2 = st.columns(2)\n    with sc_g1:\n        st.plotly_chart(scenario_waiting_time_chart(sc_results), use_container_width=True)\n    with sc_g2:\n        st.plotly_chart(scenario_queue_length_chart(sc_results), use_container_width=True)\n\n    sc_g3, sc_g4 = st.columns(2)\n    with sc_g3:\n        st.plotly_chart(scenario_utilisation_chart(sc_results), use_container_width=True)\n    with sc_g4:\n        st.plotly_chart(scenario_throughput_chart(sc_results), use_container_width=True)\n\n    # Recommendation\n    st.markdown(\"---\")\n    st.markdown(ScenarioRunner.generate_comparison_summary(sc_results))\n\n# \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n# TAB 6 \u2014 Sensitivity / What-If Studio\n# \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\nwith tabs[5]:\n    st.markdown(\"### \ud83d\udd2e Sensitivity & What-If Studio\")\n    st.markdown(\"Stress-test parameter variations to locate critical inflection points and system saturation boundaries.\")\n\n    wi_col1, wi_col2 = st.columns(2)\n    with wi_col1:\n        param_to_vary = st.selectbox(\n            \"Target Sensitivity Parameter\",\n            [\"Arrival Rate \u03bb (veh/hr)\", \"Service Time \u03bc\u207b\u00b9 (min)\", \"Number of Dispensers (c)\"],\n        )\n    with wi_col2:\n        sweep_resolution = st.slider(\"Sweep Resolution Steps\", min_value=4, max_value=8, value=6)\n\n    # Run parameter sweep\n    if param_to_vary == \"Arrival Rate \u03bb (veh/hr)\":\n        sweep_vals = np.linspace(10.0, 60.0, sweep_resolution)\n    elif param_to_vary == \"Service Time \u03bc\u207b\u00b9 (min)\":\n        sweep_vals = np.linspace(2.0, 12.0, sweep_resolution)\n    else:\n        sweep_vals = np.arange(1, min(11, sweep_resolution + 2))\n\n    wi_data = []\n    for val in sweep_vals:\n        if param_to_vary == \"Arrival Rate \u03bb (veh/hr)\":\n            cfg_s = SimulationConfig(\n                num_dispensers=config.num_dispensers,\n                arrival_rate=float(val),\n                avg_service_time=config.avg_service_time,\n                service_time_std=config.service_time_std,\n                min_service_time=config.min_service_time,\n                max_service_time=config.max_service_time,\n                simulation_duration=config.simulation_duration,\n                random_seed=config.random_seed,\n            )\n        elif param_to_vary == \"Service Time \u03bc\u207b\u00b9 (min)\":\n            cfg_s = SimulationConfig(\n                num_dispensers=config.num_dispensers,\n                arrival_rate=config.arrival_rate,\n                avg_service_time=float(val),\n                service_time_std=min(config.service_time_std, float(val) / 2.0),\n                min_service_time=max(1.0, float(val) - 2.0),\n                max_service_time=float(val) + 2.0,\n                simulation_duration=config.simulation_duration,\n                random_seed=config.random_seed,\n            )\n        else:\n            cfg_s = SimulationConfig(\n                num_dispensers=int(val),\n                arrival_rate=config.arrival_rate,\n                avg_service_time=config.avg_service_time,\n                service_time_std=config.service_time_std,\n                min_service_time=config.min_service_time,\n                max_service_time=config.max_service_time,\n                simulation_duration=config.simulation_duration,\n                random_seed=config.random_seed,\n            )\n\n        sim_s = PetrolPumpSimulation(cfg_s)\n        res_s = sim_s.run()\n        met_s = compute_metrics(res_s)\n        rho_s = traffic_intensity(cfg_s.arrival_rate, 60.0 / cfg_s.avg_service_time, cfg_s.num_dispensers)\n        wi_data.append({\n            \"val\": float(val),\n            \"wait\": met_s.avg_waiting_time,\n            \"queue\": met_s.max_queue_length,\n            \"util\": met_s.avg_utilisation * 100.0,\n            \"throughput\": met_s.throughput_per_hour,\n            \"rho\": rho_s,\n        })\n\n    # Render Curves\n    x_vals = [d[\"val\"] for d in wi_data]\n    \n    wi_c1, wi_c2 = st.columns(2)\n    with wi_c1:\n        f1 = go.Figure()\n        f1.add_trace(go.Scatter(\n            x=x_vals, y=[d[\"wait\"] for d in wi_data],\n            mode=\"lines+markers\", line=dict(color=COLOR_CYAN, width=3),\n            marker=dict(size=8, color=COLOR_CYAN), name=\"Avg Wait Time\",\n        ))\n        f1.update_layout(title=\"<b>Impact on Average Wait Time</b>\", xaxis_title=param_to_vary, yaxis_title=\"Wait Time (min)\", **COMMON_LAYOUT)\n        st.plotly_chart(f1, use_container_width=True)\n\n    with wi_c2:\n        f2 = go.Figure()\n        f2.add_trace(go.Scatter(\n            x=x_vals, y=[d[\"queue\"] for d in wi_data],\n            mode=\"lines+markers\", line=dict(color=COLOR_AMBER, width=3),\n            marker=dict(size=8, color=COLOR_AMBER), name=\"Peak Queue\",\n        ))\n        f2.update_layout(title=\"<b>Impact on Peak Queue Depth</b>\", xaxis_title=param_to_vary, yaxis_title=\"Vehicles\", **COMMON_LAYOUT)\n        st.plotly_chart(f2, use_container_width=True)\n\n# \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n# TAB 7 \u2014 Mathematical Model & Theory\n# \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\nwith tabs[6]:\n    st.markdown(\"### \ud83d\udcd6 Mathematical Foundations & Stochastic Model Formulation\")\n    \n    st.markdown(r\"\"\"\n#### 1. Stochastic Arrival Process: Poisson Process & Exponential Inter-arrivals\nIncoming customer demand is represented as a homogeneous **Poisson Process** with mean arrival rate $\\lambda$ (vehicles per hour):\n\n$$P(N(t) = k) = \\frac{(\\lambda t)^k e^{-\\lambda t}}{k!}, \\quad k = 0, 1, 2, \\dots$$\n\nThe elapsed duration between successive vehicle arrivals (inter-arrival time $\\Delta t$) follows an **Exponential Distribution**:\n\n$$f(\\Delta t) = \\lambda e^{-\\lambda \\Delta t}, \\quad \\Delta t \\ge 0$$\n\nIn our simulation engine, variates are synthesized via the **Inverse-Transform Sampling Method**:\n\n$$\\Delta t = -\\frac{\\ln(U)}{\\lambda}, \\quad U \\sim \\text{Uniform}(0, 1)$$\n\n---\n\n#### 2. Service Duration Model: Truncated Normal Distribution\nUnlike simple analytical $M/M/c$ models that assume exponential service times, real-world fuel transactions have physical minimums (nozzle insertion, payment authentication) and maximums. We therefore formulate service duration $S$ using a **Truncated Normal Distribution**:\n\n$$f(S; \\mu, \\sigma, a, b) = \\frac{\\frac{1}{\\sigma}\\phi\\left(\\frac{S - \\mu}{\\sigma}\\right)}{\\Phi\\left(\\frac{b - \\mu}{\\sigma}\\right) - \\Phi\\left(\\frac{a - \\mu}{\\sigma}\\right)}, \\quad a \\le S \\le b$$\n\nWhere:\n- $\\mu$: Configured average service duration\n- $\\sigma$: Standard deviation (variability)\n- $a$: Physical minimum bound ($\\ge 1.0$ min)\n- $b$: Upper truncation cutoff\n\n---\n\n#### 3. Kendall Notation & Queue Classification\nThe station is mathematically designated as an **$M/G/c/\\infty/\\text{FCFS}$** system:\n- **$M$**: Markovian (Poisson) arrival distribution\n- **$G$**: General (Truncated Normal) service time distribution\n- **$c$**: Number of identical fuel dispenser servers\n- **$\\infty$**: Infinite queue holding capacity\n- **$\\text{FCFS}$**: First-Come, First-Served queue discipline\n\n---\n\n#### 4. Traffic Intensity & Ergodicity Boundary\nThe stability parameter $\\rho$ (traffic intensity or server utilization) is defined as:\n\n$$\\rho = \\frac{\\lambda}{c \\cdot \\mu}$$\n\nWhere $\\mu = \\frac{60}{\\bar{S}}$ is the hourly service rate per dispenser.\n\n> **Mathematical Stability Criterion:**\n> - When **$\\rho < 1$**: The queueing system is **ergodic (stable)**. A steady-state probability distribution exists, and queue lengths remain bounded.\n> - When **$\\rho \\ge 1$**: The system is **supercritical (unstable)**. The arrival rate outpaces service capacity; queue length $L(t) \\to \\infty$ as $t \\to \\infty$.\n\n---\n\n#### 5. Little's Law\nFor any stationary queueing system in equilibrium:\n\n$$L = \\lambda W \\quad \\text{and} \\quad L_q = \\lambda W_q$$\n\nWhere:\n- $L$: Average number of vehicles in the station\n- $L_q$: Average number of vehicles waiting in queue\n- $W$: Mean total time in station\n- $W_q$: Mean waiting time prior to service start\n\"\"\")\n",
  "simulation/dispenser.py": "\"\"\"Fuel dispenser resource for the petrol pump simulation.\"\"\"\n\nfrom dataclasses import dataclass, field\nfrom typing import List\n\n\n@dataclass\nclass DispenserRecord:\n    \"\"\"A single service record for a dispenser.\"\"\"\n    vehicle_id: int\n    service_start: float\n    service_end: float\n\n\n@dataclass\nclass Dispenser:\n    \"\"\"Tracks utilisation data for a single fuel dispenser.\n\n    Attributes:\n        dispenser_id: Unique identifier.\n        records: List of service records.\n    \"\"\"\n    dispenser_id: int\n    records: List[DispenserRecord] = field(default_factory=list)\n\n    @property\n    def total_busy_time(self) -> float:\n        \"\"\"Total time this dispenser spent actively fueling vehicles.\"\"\"\n        return sum(r.service_end - r.service_start for r in self.records)\n\n    @property\n    def vehicles_served(self) -> int:\n        \"\"\"Number of vehicles served by this dispenser.\"\"\"\n        return len(self.records)\n\n    def utilisation(self, simulation_duration: float) -> float:\n        \"\"\"Fraction of time this dispenser was busy.\n\n        Args:\n            simulation_duration: Total simulation run time.\n\n        Returns:\n            Utilisation ratio between 0 and 1.\n        \"\"\"\n        if simulation_duration <= 0:\n            return 0.0\n        return min(self.total_busy_time / simulation_duration, 1.0)\n\n    def add_record(self, vehicle_id: int, start: float, end: float) -> None:\n        \"\"\"Log a completed service.\"\"\"\n        self.records.append(DispenserRecord(vehicle_id, start, end))\n\n",
  "simulation/engine.py": "\"\"\"Core discrete-event simulation engine using SimPy.\"\"\"\n\nimport math\nfrom dataclasses import dataclass, field\nfrom typing import List, Optional, Tuple\n\nimport numpy as np\nimport simpy\nfrom scipy.stats import truncnorm\n\nfrom simulation.vehicle import Vehicle, VehicleStatus\nfrom simulation.dispenser import Dispenser\n\n\n@dataclass\nclass SimulationConfig:\n    \"\"\"Configuration parameters for the petrol pump simulation.\n\n    Attributes:\n        num_dispensers: Number of fuel dispensers (1-10).\n        arrival_rate: Average vehicles per hour (lambda).\n        avg_service_time: Mean service time in minutes.\n        service_time_std: Standard deviation of service time in minutes.\n        min_service_time: Minimum service time in minutes.\n        max_service_time: Maximum service time in minutes.\n        simulation_duration: Total simulation time in minutes.\n        random_seed: Seed for reproducibility.\n    \"\"\"\n    num_dispensers: int = 3\n    arrival_rate: float = 20.0           # vehicles per hour\n    avg_service_time: float = 5.0        # minutes\n    service_time_std: float = 1.5        # minutes\n    min_service_time: float = 2.0        # minutes\n    max_service_time: float = 12.0       # minutes\n    simulation_duration: float = 120.0   # minutes (2 hours)\n    random_seed: int = 42\n\n\n@dataclass\nclass SimulationResult:\n    \"\"\"Container for all simulation output data.\"\"\"\n    vehicles: List[Vehicle] = field(default_factory=list)\n    dispensers: List[Dispenser] = field(default_factory=list)\n    queue_length_over_time: List[Tuple[float, int]] = field(default_factory=list)\n    config: Optional[SimulationConfig] = None\n\n\nclass PetrolPumpSimulation:\n    \"\"\"Discrete-event simulation of a petrol station using SimPy.\n\n    Models vehicle arrivals (Poisson process), queue waiting (FCFS),\n    and fuel service (truncated-normal duration).\n    \"\"\"\n\n    def __init__(self, config: SimulationConfig):\n        self.config = config\n        self.rng = np.random.default_rng(config.random_seed)\n        self.vehicles: List[Vehicle] = []\n        self.dispensers: List[Dispenser] = []\n        self.queue_length_over_time: List[Tuple[float, int]] = []\n        self._vehicle_counter = 0\n        self._current_queue_length = 0\n\n    # ------------------------------------------------------------------\n    # Random variate generators\n    # ------------------------------------------------------------------\n\n    def _generate_interarrival_time(self) -> float:\n        \"\"\"Generate inter-arrival time using the inverse-transform method.\n\n        Inter-arrival time = -ln(U) / lambda\n        where lambda is in vehicles per minute.\n        \"\"\"\n        lam = self.config.arrival_rate / 60.0  # convert to per minute\n        u = self.rng.random()\n        # Avoid log(0)\n        u = max(u, 1e-10)\n        return -math.log(u) / lam\n\n    def _generate_service_time(self) -> float:\n        \"\"\"Generate service time from a truncated normal distribution.\"\"\"\n        mu = self.config.avg_service_time\n        sigma = self.config.service_time_std\n        lo = self.config.min_service_time\n        hi = self.config.max_service_time\n\n        if sigma <= 0:\n            return mu\n\n        a = (lo - mu) / sigma\n        b = (hi - mu) / sigma\n        # Use scipy truncnorm with our RNG for reproducibility\n        value = truncnorm.rvs(a, b, loc=mu, scale=sigma,\n                              random_state=self.rng)\n        return float(value)\n\n    # ------------------------------------------------------------------\n    # SimPy processes\n    # ------------------------------------------------------------------\n\n    def _vehicle_process(self, env: simpy.Environment,\n                         dispenser_store: simpy.Store,\n                         vehicle: Vehicle):\n        \"\"\"SimPy process for a single vehicle going through the station.\"\"\"\n        vehicle.queue_entry_time = env.now\n        vehicle.status = VehicleStatus.WAITING\n        self._current_queue_length += 1\n        self.queue_length_over_time.append((env.now, self._current_queue_length))\n\n        # Request an available dispenser (FCFS via Store.get())\n        dispenser_idx = yield dispenser_store.get()\n\n        self._current_queue_length -= 1\n        self.queue_length_over_time.append(\n            (env.now, self._current_queue_length)\n        )\n\n        vehicle.service_start_time = env.now\n        vehicle.status = VehicleStatus.FUELING\n        vehicle.dispenser_id = dispenser_idx\n\n        service_time = vehicle.service_duration\n        yield env.timeout(service_time)\n\n        vehicle.service_end_time = env.now\n        vehicle.departure_time = env.now\n        vehicle.status = VehicleStatus.COMPLETED\n\n        # Record in the dispenser tracker\n        self.dispensers[dispenser_idx].add_record(\n            vehicle.vehicle_id,\n            vehicle.service_start_time,\n            vehicle.service_end_time,\n        )\n\n        # Release dispenser back to the available pool\n        yield dispenser_store.put(dispenser_idx)\n\n    def _arrival_process(self, env: simpy.Environment,\n                         dispenser_store: simpy.Store):\n        \"\"\"SimPy process that generates vehicle arrivals.\"\"\"\n        while True:\n            iat = self._generate_interarrival_time()\n            yield env.timeout(iat)\n\n            if env.now > self.config.simulation_duration:\n                break\n\n            self._vehicle_counter += 1\n            service_time = self._generate_service_time()\n\n            vehicle = Vehicle(\n                vehicle_id=self._vehicle_counter,\n                arrival_time=env.now,\n                service_duration=service_time,\n            )\n            self.vehicles.append(vehicle)\n            env.process(self._vehicle_process(env, dispenser_store, vehicle))\n\n    # ------------------------------------------------------------------\n    # Public API\n    # ------------------------------------------------------------------\n\n    def run(self) -> SimulationResult:\n        \"\"\"Execute the simulation and return results.\"\"\"\n        self.vehicles.clear()\n        self.queue_length_over_time.clear()\n        self._vehicle_counter = 0\n        self._current_queue_length = 0\n\n        self.dispensers = [\n            Dispenser(dispenser_id=i)\n            for i in range(self.config.num_dispensers)\n        ]\n\n        env = simpy.Environment()\n        dispenser_store = simpy.Store(env, capacity=self.config.num_dispensers)\n        for i in range(self.config.num_dispensers):\n            dispenser_store.put(i)\n\n        env.process(self._arrival_process(env, dispenser_store))\n        env.run(until=self.config.simulation_duration + 60)\n        # Extra 60 minutes to let in-progress vehicles finish\n\n        return SimulationResult(\n            vehicles=self.vehicles,\n            dispensers=self.dispensers,\n            queue_length_over_time=self.queue_length_over_time,\n            config=self.config,\n        )\n\n",
  "simulation/metrics.py": "\"\"\"Statistical metrics computed from simulation results.\"\"\"\n\nfrom dataclasses import dataclass\nfrom typing import List\n\nimport numpy as np\n\nfrom simulation.vehicle import Vehicle, VehicleStatus\nfrom simulation.dispenser import Dispenser\nfrom simulation.engine import SimulationResult\n\n\n@dataclass\nclass SimulationMetrics:\n    \"\"\"Aggregated metrics for a single simulation run.\"\"\"\n    total_arrived: int = 0\n    total_served: int = 0\n    avg_waiting_time: float = 0.0\n    median_waiting_time: float = 0.0\n    max_waiting_time: float = 0.0\n    std_waiting_time: float = 0.0\n    p95_waiting_time: float = 0.0\n    avg_time_in_system: float = 0.0\n    avg_queue_length: float = 0.0\n    max_queue_length: int = 0\n    avg_utilisation: float = 0.0\n    throughput_per_hour: float = 0.0\n    dispenser_utilisations: List[float] = None  # type: ignore[assignment]\n\n    def __post_init__(self):\n        if self.dispenser_utilisations is None:\n            self.dispenser_utilisations = []\n\n\ndef compute_metrics(result: SimulationResult) -> SimulationMetrics:\n    \"\"\"Compute all statistical metrics from simulation results.\n\n    Args:\n        result: The completed SimulationResult.\n\n    Returns:\n        Populated SimulationMetrics object.\n    \"\"\"\n    config = result.config\n    vehicles = result.vehicles\n    dispensers = result.dispensers\n    queue_ts = result.queue_length_over_time\n    sim_duration = config.simulation_duration if config else 120.0\n\n    metrics = SimulationMetrics()\n    metrics.total_arrived = len(vehicles)\n\n    completed = [v for v in vehicles if v.status == VehicleStatus.COMPLETED]\n    metrics.total_served = len(completed)\n\n    if completed:\n        waiting_times = np.array([v.waiting_time for v in completed])\n        system_times = np.array([v.time_in_system for v in completed])\n\n        metrics.avg_waiting_time = float(np.mean(waiting_times))\n        metrics.median_waiting_time = float(np.median(waiting_times))\n        metrics.max_waiting_time = float(np.max(waiting_times))\n        metrics.std_waiting_time = float(np.std(waiting_times))\n        metrics.p95_waiting_time = float(np.percentile(waiting_times, 95))\n        metrics.avg_time_in_system = float(np.mean(system_times))\n    else:\n        metrics.avg_waiting_time = 0.0\n        metrics.median_waiting_time = 0.0\n        metrics.max_waiting_time = 0.0\n        metrics.std_waiting_time = 0.0\n        metrics.p95_waiting_time = 0.0\n        metrics.avg_time_in_system = 0.0\n\n    # Queue length statistics (time-weighted average)\n    if queue_ts:\n        metrics.max_queue_length = max(ql for _, ql in queue_ts)\n        # Compute time-weighted average queue length\n        total_area = 0.0\n        for i in range(len(queue_ts) - 1):\n            t_curr, q_curr = queue_ts[i]\n            t_next, _ = queue_ts[i + 1]\n            total_area += q_curr * (t_next - t_curr)\n        last_t, last_q = queue_ts[-1]\n        if last_t < sim_duration:\n            total_area += last_q * (sim_duration - last_t)\n        metrics.avg_queue_length = total_area / sim_duration if sim_duration > 0 else 0.0\n    else:\n        metrics.avg_queue_length = 0.0\n        metrics.max_queue_length = 0\n\n    # Dispenser utilisation\n    if dispensers:\n        utilisations = [d.utilisation(sim_duration) for d in dispensers]\n        metrics.dispenser_utilisations = utilisations\n        metrics.avg_utilisation = float(np.mean(utilisations))\n    else:\n        metrics.dispenser_utilisations = []\n        metrics.avg_utilisation = 0.0\n\n    # Throughput\n    sim_hours = sim_duration / 60.0\n    metrics.throughput_per_hour = (\n        metrics.total_served / sim_hours if sim_hours > 0 else 0.0\n    )\n\n    return metrics\n\n",
  "simulation/scenarios.py": "\"\"\"Scenario comparison and what-if analysis runner.\"\"\"\n\nfrom dataclasses import dataclass\nfrom typing import List\n\nfrom simulation.engine import PetrolPumpSimulation, SimulationConfig\nfrom simulation.metrics import SimulationMetrics, compute_metrics\n\n\n@dataclass\nclass ScenarioConfig:\n    \"\"\"Configuration for a named scenario.\"\"\"\n    name: str\n    config: SimulationConfig\n\n\n@dataclass\nclass ScenarioResult:\n    \"\"\"Result of running a single scenario (possibly with repetitions).\"\"\"\n    name: str\n    config: SimulationConfig\n    metrics: SimulationMetrics\n    all_metrics: List[SimulationMetrics]\n\n\nclass ScenarioRunner:\n    \"\"\"Run and compare multiple simulation scenarios.\"\"\"\n\n    @staticmethod\n    def run_scenario(scenario: ScenarioConfig,\n                     repetitions: int = 1) -> ScenarioResult:\n        \"\"\"Run a single scenario with optional repetitions.\n\n        Args:\n            scenario: The scenario configuration.\n            repetitions: Number of independent runs.\n\n        Returns:\n            ScenarioResult with averaged metrics.\n        \"\"\"\n        all_metrics: List[SimulationMetrics] = []\n        for rep in range(repetitions):\n            cfg = SimulationConfig(\n                num_dispensers=scenario.config.num_dispensers,\n                arrival_rate=scenario.config.arrival_rate,\n                avg_service_time=scenario.config.avg_service_time,\n                service_time_std=scenario.config.service_time_std,\n                min_service_time=scenario.config.min_service_time,\n                max_service_time=scenario.config.max_service_time,\n                simulation_duration=scenario.config.simulation_duration,\n                random_seed=scenario.config.random_seed + rep,\n            )\n            sim = PetrolPumpSimulation(cfg)\n            result = sim.run()\n            metrics = compute_metrics(result)\n            all_metrics.append(metrics)\n\n        avg = ScenarioRunner._average_metrics(all_metrics)\n        return ScenarioResult(\n            name=scenario.name,\n            config=scenario.config,\n            metrics=avg,\n            all_metrics=all_metrics,\n        )\n\n    @staticmethod\n    def run_multiple(scenarios: List[ScenarioConfig],\n                     repetitions: int = 1) -> List[ScenarioResult]:\n        \"\"\"Run multiple scenarios and return all results.\"\"\"\n        return [\n            ScenarioRunner.run_scenario(s, repetitions)\n            for s in scenarios\n        ]\n\n    @staticmethod\n    def _average_metrics(all_m: List[SimulationMetrics]) -> SimulationMetrics:\n        \"\"\"Average metrics across multiple simulation runs.\"\"\"\n        if not all_m:\n            return SimulationMetrics()\n        n = len(all_m)\n        avg = SimulationMetrics()\n        avg.total_arrived = int(sum(m.total_arrived for m in all_m) / n)\n        avg.total_served = int(sum(m.total_served for m in all_m) / n)\n        avg.avg_waiting_time = sum(m.avg_waiting_time for m in all_m) / n\n        avg.median_waiting_time = sum(m.median_waiting_time for m in all_m) / n\n        avg.max_waiting_time = sum(m.max_waiting_time for m in all_m) / n\n        avg.std_waiting_time = sum(m.std_waiting_time for m in all_m) / n\n        avg.p95_waiting_time = sum(m.p95_waiting_time for m in all_m) / n\n        avg.avg_time_in_system = sum(m.avg_time_in_system for m in all_m) / n\n        avg.avg_queue_length = sum(m.avg_queue_length for m in all_m) / n\n        avg.max_queue_length = int(sum(m.max_queue_length for m in all_m) / n)\n        avg.avg_utilisation = sum(m.avg_utilisation for m in all_m) / n\n        avg.throughput_per_hour = sum(m.throughput_per_hour for m in all_m) / n\n        # Average per-dispenser utilisation\n        if all_m[0].dispenser_utilisations:\n            nd = len(all_m[0].dispenser_utilisations)\n            avg.dispenser_utilisations = [\n                sum(m.dispenser_utilisations[i] for m in all_m) / n\n                for i in range(nd)\n            ]\n        return avg\n\n    @staticmethod\n    def generate_comparison_summary(results: List[ScenarioResult]) -> str:\n        \"\"\"Generate a textual comparison of scenario results.\"\"\"\n        if not results:\n            return \"No scenarios to compare.\"\n\n        lines = []\n        best_wait = min(results, key=lambda r: r.metrics.avg_waiting_time)\n        best_util = max(results, key=lambda r: r.metrics.avg_utilisation)\n        best_throughput = max(results, key=lambda r: r.metrics.throughput_per_hour)\n        best_queue = min(results, key=lambda r: r.metrics.max_queue_length)\n\n        lines.append(\"### Scenario Comparison Summary\\n\")\n        lines.append(\n            f\"**Lowest Average Waiting Time**: {best_wait.name} \"\n            f\"({best_wait.metrics.avg_waiting_time:.2f} min)\"\n        )\n        lines.append(\n            f\"**Highest Dispenser Utilisation**: {best_util.name} \"\n            f\"({best_util.metrics.avg_utilisation:.1%})\"\n        )\n        lines.append(\n            f\"**Highest Throughput**: {best_throughput.name} \"\n            f\"({best_throughput.metrics.throughput_per_hour:.1f} vehicles/hour)\"\n        )\n        lines.append(\n            f\"**Smallest Maximum Queue**: {best_queue.name} \"\n            f\"({best_queue.metrics.max_queue_length} vehicles)\"\n        )\n        lines.append(\"\")\n\n        # Check stability for each scenario\n        for r in results:\n            lam = r.config.arrival_rate / 60.0  # per minute\n            mu = 1.0 / r.config.avg_service_time  # per minute\n            rho = lam / (r.config.num_dispensers * mu)\n            status = \"\u2705 Stable\" if rho < 1 else \"\u26a0\ufe0f Unstable (\u03c1 \u2265 1)\"\n            lines.append(\n                f\"- **{r.name}**: \u03c1 = {rho:.3f} \u2014 {status}\"\n            )\n\n        lines.append(\"\")\n        lines.append(\n            f\"**Recommendation**: **{best_wait.name}** offers the best customer \"\n            f\"experience with the lowest average wait, while **{best_util.name}** \"\n            f\"maximises resource utilisation.\"\n        )\n        return \"\\n\".join(lines)\n\n",
  "simulation/vehicle.py": "\"\"\"Vehicle entity for the petrol pump simulation.\"\"\"\n\nfrom dataclasses import dataclass, field\nfrom enum import Enum\n\n\nclass VehicleStatus(Enum):\n    \"\"\"Possible states of a vehicle in the simulation.\"\"\"\n    ARRIVED = \"arrived\"\n    WAITING = \"waiting\"\n    FUELING = \"fueling\"\n    COMPLETED = \"completed\"\n\n\n@dataclass\nclass Vehicle:\n    \"\"\"Represents a single vehicle in the simulation.\n\n    Attributes:\n        vehicle_id: Unique identifier for the vehicle.\n        arrival_time: Simulation time when the vehicle arrived at the station.\n        queue_entry_time: Time when the vehicle entered the queue.\n        service_start_time: Time when fueling began.\n        service_end_time: Time when fueling completed.\n        departure_time: Time when the vehicle left the station.\n        service_duration: How long the fueling takes.\n        dispenser_id: Which dispenser served this vehicle.\n        status: Current state of the vehicle.\n    \"\"\"\n    vehicle_id: int\n    arrival_time: float\n    queue_entry_time: float = 0.0\n    service_start_time: float = 0.0\n    service_end_time: float = 0.0\n    departure_time: float = 0.0\n    service_duration: float = 0.0\n    dispenser_id: int = -1\n    status: VehicleStatus = field(default=VehicleStatus.ARRIVED)\n\n    @property\n    def waiting_time(self) -> float:\n        \"\"\"Time spent waiting in the queue before service begins.\"\"\"\n        if self.service_start_time > 0:\n            return self.service_start_time - self.arrival_time\n        return 0.0\n\n    @property\n    def time_in_system(self) -> float:\n        \"\"\"Total time spent at the petrol station.\"\"\"\n        if self.departure_time > 0:\n            return self.departure_time - self.arrival_time\n        return 0.0\n\n    def __repr__(self) -> str:\n        return (\n            f\"Vehicle(id={self.vehicle_id}, arrival={self.arrival_time:.2f}, \"\n            f\"status={self.status.value})\"\n        )\n\n",
  "simulation/__init__.py": "\"\"\"Petrol pump queue simulation engine.\"\"\"\n\nfrom simulation.engine import PetrolPumpSimulation, SimulationConfig\nfrom simulation.vehicle import Vehicle\nfrom simulation.dispenser import Dispenser\nfrom simulation.metrics import SimulationMetrics, compute_metrics\nfrom simulation.scenarios import ScenarioRunner, ScenarioConfig\n\n__all__ = [\n    \"PetrolPumpSimulation\",\n    \"SimulationConfig\",\n    \"Vehicle\",\n    \"Dispenser\",\n    \"SimulationMetrics\",\n    \"compute_metrics\",\n    \"ScenarioRunner\",\n    \"ScenarioConfig\",\n]\n\n",
  "visualization/charts.py": "\"\"\"Plotly chart generators with modern, executive-grade styling for the simulation dashboard.\"\"\"\n\nfrom typing import List, Tuple\nimport numpy as np\nimport plotly.graph_objects as go\nfrom simulation.engine import SimulationResult\nfrom simulation.metrics import SimulationMetrics\nfrom simulation.vehicle import VehicleStatus\nfrom simulation.scenarios import ScenarioResult\n\n# ---- Ultra-clean Obsidian / Dark Glass Theme ----\nCOLOR_EMERALD = \"#10b981\"   # Primary accent\nCOLOR_CYAN    = \"#06b6d4\"   # Secondary accent / arrivals\nCOLOR_BLUE    = \"#3b82f6\"   # Completed / through\nCOLOR_AMBER   = \"#f59e0b\"   # Queue / warning\nCOLOR_ROSE    = \"#ef4444\"   # Bottleneck / critical\nCOLOR_PURPLE  = \"#8b5cf6\"   # Theoretical / baseline\n\nBG_CANVAS     = \"#0b0f19\"   # Deep obsidian\nBG_SURFACE    = \"#111827\"   # Elevated card surface\nBORDER_SUBTLE = \"#1f2937\"   # Fine border\nTEXT_PRIMARY  = \"#f9fafb\"   # Crisp white\nTEXT_MUTED    = \"#9ca3af\"   # Muted gray\n\nCOMMON_LAYOUT = dict(\n    paper_bgcolor=\"rgba(0,0,0,0)\",\n    plot_bgcolor=\"rgba(17, 24, 39, 0.6)\",\n    font=dict(color=TEXT_PRIMARY, family=\"-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif\", size=12),\n    xaxis=dict(\n        gridcolor=\"rgba(255, 255, 255, 0.06)\",\n        zerolinecolor=\"rgba(255, 255, 255, 0.12)\",\n        tickfont=dict(color=TEXT_MUTED, size=11),\n        title_font=dict(color=TEXT_PRIMARY, size=12),\n    ),\n    yaxis=dict(\n        gridcolor=\"rgba(255, 255, 255, 0.06)\",\n        zerolinecolor=\"rgba(255, 255, 255, 0.12)\",\n        tickfont=dict(color=TEXT_MUTED, size=11),\n        title_font=dict(color=TEXT_PRIMARY, size=12),\n    ),\n    margin=dict(l=48, r=24, t=48, b=40),\n    hoverlabel=dict(\n        bgcolor=\"#1f2937\",\n        font_color=\"#f9fafb\",\n        font_size=12,\n        bordercolor=\"#374151\",\n    ),\n    legend=dict(\n        orientation=\"h\",\n        yanchor=\"bottom\",\n        y=1.02,\n        xanchor=\"right\",\n        x=1,\n        font=dict(color=TEXT_MUTED, size=11),\n    ),\n)\n\n\ndef queue_length_chart(queue_ts: List[Tuple[float, int]]) -> go.Figure:\n    \"\"\"Stepped area chart of queue length over simulation time with color thresholds.\"\"\"\n    fig = go.Figure()\n    if not queue_ts:\n        fig.update_layout(title=\"Queue Length Timeline\", **COMMON_LAYOUT)\n        return fig\n\n    times = [t for t, _ in queue_ts]\n    lengths = [q for _, q in queue_ts]\n    max_q = max(lengths) if lengths else 0\n\n    # Gradient area trace\n    fig.add_trace(go.Scatter(\n        x=times,\n        y=lengths,\n        mode=\"lines\",\n        line_shape=\"hv\",  # Discrete event stepped transition\n        line=dict(color=COLOR_AMBER, width=2.5),\n        fill=\"tozeroy\",\n        fillcolor=\"rgba(245, 158, 11, 0.15)\",\n        name=\"Queue Depth\",\n        hovertemplate=\"<b>Time:</b> %{x:.1f} min<br><b>Queue:</b> %{y} vehicles<extra></extra>\",\n    ))\n\n    # Add warning reference line if queue gets high\n    if max_q > 5:\n        fig.add_hline(\n            y=5,\n            line_dash=\"dot\",\n            line_color=\"rgba(239, 68, 68, 0.5)\",\n            annotation_text=\"Congestion Threshold (5 veh)\",\n            annotation_position=\"bottom right\",\n            annotation_font=dict(color=COLOR_ROSE, size=10),\n        )\n\n    fig.update_layout(\n        title=dict(text=\"<b>Live Queue Depth Over Time</b>\", font=dict(size=14, color=TEXT_PRIMARY)),\n        xaxis_title=\"Simulation Time (minutes)\",\n        yaxis_title=\"Vehicles Waiting in Queue\",\n        **COMMON_LAYOUT,\n    )\n    return fig\n\n\ndef arrivals_and_departures_chart(result: SimulationResult) -> go.Figure:\n    \"\"\"Cumulative arrivals vs service completions showing the service backlog gap.\"\"\"\n    fig = go.Figure()\n    if not result.vehicles:\n        fig.update_layout(title=\"Arrivals vs Completions\", **COMMON_LAYOUT)\n        return fig\n\n    # Cumulative arrivals\n    arr_times = sorted(v.arrival_time for v in result.vehicles)\n    arr_counts = list(range(1, len(arr_times) + 1))\n\n    fig.add_trace(go.Scatter(\n        x=arr_times,\n        y=arr_counts,\n        mode=\"lines\",\n        line=dict(color=COLOR_CYAN, width=2.5),\n        name=\"Cumulative Arrivals\",\n        hovertemplate=\"<b>Arrivals:</b> %{y} at %{x:.1f} min<extra></extra>\",\n    ))\n\n    # Cumulative completions\n    completed = [v for v in result.vehicles if v.status == VehicleStatus.COMPLETED]\n    if completed:\n        end_times = sorted(v.service_end_time for v in completed)\n        end_counts = list(range(1, len(end_times) + 1))\n        fig.add_trace(go.Scatter(\n            x=end_times,\n            y=end_counts,\n            mode=\"lines\",\n            line=dict(color=COLOR_EMERALD, width=2.5),\n            name=\"Cumulative Served\",\n            hovertemplate=\"<b>Completed:</b> %{y} at %{x:.1f} min<extra></extra>\",\n        ))\n\n    fig.update_layout(\n        title=dict(text=\"<b>Cumulative Throughput Dynamics</b> (Arrivals vs Departures)\", font=dict(size=14, color=TEXT_PRIMARY)),\n        xaxis_title=\"Simulation Time (minutes)\",\n        yaxis_title=\"Total Vehicles\",\n        **COMMON_LAYOUT,\n    )\n    return fig\n\n\ndef arrivals_over_time_chart(result: SimulationResult) -> go.Figure:\n    \"\"\"Standalone cumulative arrivals chart.\"\"\"\n    return arrivals_and_departures_chart(result)\n\n\ndef service_completions_chart(result: SimulationResult) -> go.Figure:\n    \"\"\"Hourly service completion velocity bar chart.\"\"\"\n    fig = go.Figure()\n    completed = [v for v in result.vehicles if v.status == VehicleStatus.COMPLETED]\n    if not completed:\n        fig.update_layout(title=\"Service Completions Velocity\", **COMMON_LAYOUT)\n        return fig\n\n    # Bin completions into 15-minute intervals\n    dur = result.config.simulation_duration if result.config else 120.0\n    bins = np.arange(0, dur + 15, 15)\n    end_times = [v.service_end_time for v in completed]\n    counts, bin_edges = np.histogram(end_times, bins=bins)\n    bin_centers = (bin_edges[:-1] + bin_edges[1:]) / 2\n\n    fig.add_trace(go.Bar(\n        x=bin_centers,\n        y=counts,\n        marker=dict(\n            color=COLOR_EMERALD,\n            line=dict(color=\"rgba(16, 185, 129, 0.4)\", width=1),\n        ),\n        name=\"Vehicles Served\",\n        hovertemplate=\"<b>Interval:</b> %{x:.0f}m \u00b17.5m<br><b>Served:</b> %{y} vehicles<extra></extra>\",\n    ))\n\n    fig.update_layout(\n        title=dict(text=\"<b>Service Velocity</b> (Vehicles Completed per 15-Min Window)\", font=dict(size=14, color=TEXT_PRIMARY)),\n        xaxis_title=\"Simulation Timeline (minutes)\",\n        yaxis_title=\"Vehicles Completed\",\n        **COMMON_LAYOUT,\n    )\n    return fig\n\n\ndef waiting_time_distribution_chart(result: SimulationResult) -> go.Figure:\n    \"\"\"Polished distribution histogram of vehicle waiting times with mean & median indicators.\"\"\"\n    fig = go.Figure()\n    completed = [v for v in result.vehicles if v.status == VehicleStatus.COMPLETED]\n    if not completed:\n        fig.update_layout(title=\"Waiting Time Distribution\", **COMMON_LAYOUT)\n        return fig\n\n    waits = [v.waiting_time for v in completed]\n    mean_w = float(np.mean(waits))\n    med_w = float(np.median(waits))\n    p95_w = float(np.percentile(waits, 95))\n\n    fig.add_trace(go.Histogram(\n        x=waits,\n        nbinsx=24,\n        marker=dict(\n            color=\"rgba(16, 185, 129, 0.7)\",\n            line=dict(color=\"#10b981\", width=1.5),\n        ),\n        name=\"Vehicle Count\",\n        hovertemplate=\"<b>Wait Range:</b> %{x:.1f} min<br><b>Vehicles:</b> %{y}<extra></extra>\",\n    ))\n\n    # Mean line\n    fig.add_vline(\n        x=mean_w,\n        line_dash=\"dash\",\n        line_color=COLOR_CYAN,\n        annotation_text=f\"Mean: {mean_w:.1f}m\",\n        annotation_position=\"top right\",\n        annotation_font=dict(color=COLOR_CYAN, size=11),\n    )\n\n    # 95th Percentile line\n    fig.add_vline(\n        x=p95_w,\n        line_dash=\"dot\",\n        line_color=COLOR_ROSE,\n        annotation_text=f\"95th %ile: {p95_w:.1f}m\",\n        annotation_position=\"top right\",\n        annotation_font=dict(color=COLOR_ROSE, size=11),\n    )\n\n    fig.update_layout(\n        title=dict(text=\"<b>Waiting Time Frequency Distribution</b>\", font=dict(size=14, color=TEXT_PRIMARY)),\n        xaxis_title=\"Queue Wait Time (minutes)\",\n        yaxis_title=\"Number of Vehicles\",\n        **COMMON_LAYOUT,\n    )\n    return fig\n\n\ndef dispenser_utilisation_chart(metrics: SimulationMetrics, num_dispensers: int) -> go.Figure:\n    \"\"\"Individual dispenser workload comparison with utilization threshold benchmarks.\"\"\"\n    fig = go.Figure()\n    if not metrics.dispenser_utilisations:\n        fig.update_layout(title=\"Dispenser Utilisation\", **COMMON_LAYOUT)\n        return fig\n\n    labels = [f\"Pump #{i+1}\" for i in range(num_dispensers)]\n    values = [u * 100 for u in metrics.dispenser_utilisations]\n\n    # Color code bars by load intensity\n    bar_colors = [\n        COLOR_ROSE if v >= 90 else (COLOR_AMBER if v >= 75 else COLOR_EMERALD)\n        for v in values\n    ]\n\n    fig.add_trace(go.Bar(\n        x=labels,\n        y=values,\n        marker=dict(\n            color=bar_colors,\n            line=dict(color=\"rgba(255,255,255,0.15)\", width=1),\n        ),\n        text=[f\"<b>{v:.1f}%</b>\" for v in values],\n        textposition=\"outside\",\n        textfont=dict(color=TEXT_PRIMARY, size=12),\n        hovertemplate=\"<b>%{x}</b><br>Utilisation: %{y:.1f}%<extra></extra>\",\n    ))\n\n    # Target optimal utilization zone (60-80%)\n    fig.add_hrect(\n        y0=60, y1=85,\n        fillcolor=\"rgba(16, 185, 129, 0.08)\",\n        layer=\"below\",\n        line_width=0,\n        annotation_text=\"Optimal Uti
